name: Deploy to Pages

on:
  push:
    branches: [translation]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn run prod
        env:
          DOCUSAURUS_IGNORE_SSG_WARNINGS: true

      - name: Push to Pages repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.PAGES_TOKEN }}@github.com/${{ secrets.PAGES_REPO }}.git /tmp/pages
          rm -rf /tmp/pages/public/d2lang
          mkdir -p /tmp/pages/public
          cp -r build /tmp/pages/public/d2lang
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/d2lang
          git diff --cached --quiet && exit 0
          git commit -m "deploy: sync d2 zh docs"
          git push
